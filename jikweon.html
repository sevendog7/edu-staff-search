<script>
(function(){
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function fullNum(ext, pre){
    ext = (ext||'').trim(); if(!ext) return '';
    if(/^0\d{1,3}-\d{3,4}-\d{4}$/.test(ext)) return ext;
    const area = (pre||'').split('-')[0];
    if(/^\d{3,4}-\d{4}$/.test(ext) && area) return area+'-'+ext;
    if(/^\d{4}$/.test(ext) && (pre||'').includes('-')) return pre+'-'+ext;
    return ext;
  }

  // ---- parse
  const sections = []; let S=null, D=null, T=null, last='';
  const people = [];
  document.getElementById('data').textContent.split('\n').forEach(raw => {
    const l = raw.trim(); if(!l) return;
    if(l[0]==='@'){ const [id,name]=l.slice(1).split('|'); S={id,name,heads:[],depts:[]}; sections.push(S); D=null; T=null; last=''; return; }
    if(l[0]==='#'){ const f=l.slice(1).split('|'); D={name:f[0],loc:f[1]||'',tel:f[2]||'',fax:f[3]||'',pre:f[4]||'',heads:[],teams:[]}; S.depts.push(D); T=null; last=''; return; }
    if(l[0]==='>'){ const f=l.slice(1).split('|'); T={name:f[0],pre:f[1]||'',note:f[2]||'',people:[]}; D.teams.push(T); last=''; return; }
    const f = l.split('/');
    const title = (f[0]||'').trim() || last; last = title;
    const pre = T ? T.pre : (D ? D.pre : '');
    const num = fullNum(f[2], pre);
    const p = { title, name:(f[1]||'').trim(), num, note:f.slice(3).join('/').trim(),
      area: /^061/.test(num)?'061':/^062/.test(num)?'062':'',
      sec:S, dept:D, team:T };
    p.digits = num.replace(/\D/g,'') + ' ' + p.note.replace(/\D/g,'');
    p.hay = [p.name, p.name.replace(/\s/g,''), title, T?T.name:'', D?D.name:'', S.name, p.note, D?D.loc:'', T?T.note:''].join(' ').toLowerCase();
    p.i = people.length; people.push(p);
    (T ? T.people : D ? D.heads : S.heads).push(p);
  });

  // ---- render
  function numHTML(n){
    if(!n) return '<span>번호 미기재</span>';
    const m = n.match(/^(.*-)(\d{4})$/);
    return m ? esc(m[1])+'<b>'+esc(m[2])+'</b>' : '<b>'+esc(n)+'</b>';
  }
  function row(p){
    const main = p.name || p.title;
    const sub = p.name ? p.title : '';
    const cls = p.area==='061'?'jn':p.area==='062'?'gj':'';
    return `<button class="p" id="p${p.i}" data-i="${p.i}"${p.num?'':' disabled'} title="${p.num?'눌러서 번호 복사':''}">`+
      `<span class="p-name" id="n${p.i}">${esc(main)}</span><span class="p-title">${esc(sub)}</span>`+
      `<span class="p-num"><i class="dot ${cls}"></i>${numHTML(p.num)}</span>`+
      (p.note?`<span class="p-note">${esc(p.note)}</span>`:'')+`</button>`;
  }
  let html='', rail='<div class="rail-h">UNITS</div>', chips='';
  let nDept=0, nTeam=0;
  sections.forEach((s,si)=>{
    const total = s.heads.length + s.depts.reduce((a,d)=>a+d.heads.length+d.teams.reduce((b,t)=>b+t.people.length,0),0);
    html += `<section class="sec" id="sec-${s.id}"><div class="sec-h"><h2>${esc(s.name)}</h2><span class="sec-meta">${s.depts.length} UNITS · ${total} ENTRIES</span></div>`;
    if(s.heads.length) html += `<div class="leads" id="sh${si}">${s.heads.map(row).join('')}</div>`;
    s.depts.forEach((d,di)=>{
      nDept++;
      const meta = [d.loc?`<span class="tag">${esc(d.loc)}</span>`:'', d.tel?`<span class="dtel"><i>T</i>${esc(d.tel)}</span>`:'', d.fax?`<span class="dtel"><i>F</i>${esc(d.fax)}</span>`:''].join('');
      html += `<article class="dept" id="d${si}-${di}"><div class="dept-h"><h3>${esc(d.name)}</h3>${meta}</div>`;
      if(d.heads.length) html += `<div class="dheads" id="dh${si}-${di}">${d.heads.map(row).join('')}</div>`;
      if(d.teams.length){
        html += `<div class="teams">`;
        d.teams.forEach((t,ti)=>{ nTeam++;
          html += `<div class="team" id="t${si}-${di}-${ti}"><div class="team-h"><span>${esc(t.name)}</span><em id="tc${si}-${di}-${ti}">${t.people.length}</em></div>`+
            (t.note?`<div class="team-note">${esc(t.note)}</div>`:'')+t.people.map(row).join('')+`</div>`;
        });
        html += `</div>`;
      }
      html += `</article>`;
    });
    html += `</section>`;
    rail += `<a href="#sec-${s.id}" data-s="${s.id}"><span>${esc(s.name)}</span><em id="rc${si}">${total}</em></a>`;
    chips += `<a href="#sec-${s.id}" data-s="${s.id}">${esc(s.name)} <em id="cc${si}">${total}</em></a>`;
  });
  html += `<div class="empty" id="empty" hidden><b>일치하는 연락처가 없습니다</b>이름의 일부나 내선 4자리로 다시 찾아보세요. 지역번호 필터가 켜져 있다면 '전체'로 바꿔 보세요.</div>`;
  const main = document.getElementById('main'); main.innerHTML = html;
  document.getElementById('rail').innerHTML = rail;
  document.getElementById('chips').innerHTML = chips;
  const named = people.filter(p=>p.name).length;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${named}</b><span>등록 인원</span></div><div class="stat"><b>${nDept}</b><span>부서·기관</span></div><div class="stat"><b>${nTeam}</b><span>팀·실</span></div>`;

  people.forEach(p=>{ p.el=document.getElementById('p'+p.i); p.nameEl=document.getElementById('n'+p.i); });

  // ---- filter
  const q = document.getElementById('q'), clearBtn = document.getElementById('clear'), kbd = document.getElementById('kbd');
  const status = document.getElementById('status');
  let region='all', toks=[];
  try{ const r=localStorage.getItem('dir-region'); if(r==='061'||r==='062') region=r; }catch(e){}
  function match(p){
    if(region!=='all' && p.area!==region) return false;
    return toks.every(t => /^[\d-]+$/.test(t) ? p.digits.includes(t.replace(/-/g,'')) : p.hay.includes(t));
  }
  function hl(text){
    let out = esc(text);
    toks.filter(t=>!/^[\d-]+$/.test(t)).forEach(t=>{
      const e = esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      out = out.replace(new RegExp(e,'gi'), m=>`<mark>${m}</mark>`);
    });
    return out;
  }
  function filt(arr){ let c=0; arr.forEach(p=>{ const ok=match(p); p.el.hidden=!ok; if(ok){c++; p.nameEl.innerHTML = toks.length?hl(p.name||p.title):esc(p.name||p.title);} }); return c; }
  function apply(){
    const v = q.value.trim().toLowerCase(); toks = v ? v.split(/\s+/) : [];
    clearBtn.hidden = !v; kbd.hidden = !!v;
    let total=0;
    sections.forEach((s,si)=>{
      let sc = filt(s.heads);
      const sh=document.getElementById('sh'+si); if(sh) sh.hidden = !sc;
      s.depts.forEach((d,di)=>{
        const hc = filt(d.heads); let dc = hc;
        const dh=document.getElementById(`dh${si}-${di}`); if(dh) dh.hidden=!hc;
        d.teams.forEach((t,ti)=>{ const c=filt(t.people); dc+=c;
          document.getElementById(`t${si}-${di}-${ti}`).hidden=!c;
          document.getElementById(`tc${si}-${di}-${ti}`).textContent=c; });
        document.getElementById(`d${si}-${di}`).hidden=!dc; sc+=dc;
      });
      document.getElementById('sec-'+s.id).hidden=!sc;
      document.getElementById('rc'+si).textContent=sc; document.getElementById('cc'+si).textContent=sc;
      document.querySelector(`.rail a[data-s="${s.id}"]`).classList.toggle('dim',!sc);
      total+=sc;
    });
    document.getElementById('empty').hidden = !!total;
    status.textContent = (toks.length||region!=='all') ? `표시 ${total}건` : `전체 ${people.length}건`;
  }
  let tmr; q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(apply,80); });
  clearBtn.addEventListener('click',()=>{ q.value=''; apply(); q.focus(); });
  document.querySelectorAll('.seg button').forEach(b=>{
    b.setAttribute('aria-pressed', b.dataset.r===region);
    b.addEventListener('click',()=>{ region=b.dataset.r;
      document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed', x===b));
      try{ localStorage.setItem('dir-region',region); }catch(e){}
      apply(); });
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); q.select(); }
    else if(e.key==='Escape' && document.activeElement===q){ q.value=''; apply(); }
  });
  apply();

  // ---- copy
  const toast=document.getElementById('toast'); let tt;
  function show(msg){ toast.innerHTML=msg; toast.hidden=false; clearTimeout(tt); tt=setTimeout(()=>toast.hidden=true,1800); }
  main.addEventListener('click',e=>{
    const b=e.target.closest('.p[data-i]'); if(!b||b.disabled) return;
    const p=people[+b.dataset.i]; const who=esc(p.name||p.title);
    const done=()=>show(`${who} <b>${esc(p.num)}</b> 복사됨`);
    const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(b.querySelector('.p-num')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); show(`${who} 번호를 선택했습니다. Ctrl+C로 복사하세요`); };
    try{ navigator.clipboard.writeText(p.num).then(done,fallback); }catch(err){ fallback(); }
  });

  // ---- active section in rail/chips
  const links=[...document.querySelectorAll('.rail a, .chips a')];
  const io=new IntersectionObserver(ents=>{
    ents.forEach(en=>{ if(en.isIntersecting){ const id=en.target.id.slice(4);
      links.forEach(a=>a.classList.toggle('on',a.dataset.s===id));
      const c=document.querySelector(`.chips a[data-s="${id}"]`); if(c&&c.parentNode.scrollWidth>c.parentNode.clientWidth){ c.parentNode.scrollTo({left:c.offsetLeft-20,behavior:'smooth'}); } } });
  },{rootMargin:'-140px 0px -65% 0px'});
  sections.forEach(s=>io.observe(document.getElementById('sec-'+s.id)));
})();
</script>
